name: Test suite

# Full core/tests suite (pytest + shell tests) on every pull request and on main.
# No path filter: a change anywhere can break any skill.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run core/tests (clean environment)
        run: bash core/tests/run_suite.sh all
