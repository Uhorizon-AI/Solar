name: Test suite

# Full core/tests suite (pytest + shell tests) on every pull request and on main.
# No path filter: a change anywhere can break any skill.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A group per commit on main, so two quick merges never cancel each other's run.
  group: test-suite-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Only superseded PR runs are cancelled; a run on main must finish so its commit keeps a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: all
          - os: macos-latest
            mode: macos
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # test_client_update.sh needs release tags
      - uses: astral-sh/setup-uv@v7
        with:
          # macOS: a gateway test leaves a `uv run` alive (it blocked the prune before
          # setup-uv v7); the cache is a few KB, so pruning buys nothing there.
          prune-cache: ${{ runner.os != 'macOS' }}
      - name: Install coreutils (per-test timeout for shell tests on macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils
      - name: Validate release intent (ordinary changes do not request publication)
        env:
          GH_TOKEN: ${{ github.token }}
          SOLAR_RELEASE_REPO: ${{ github.repository }}
        run: python3 core/scripts/release_automation.py validate
      - name: Run core/tests (clean environment)
        run: bash core/tests/run_suite.sh ${{ matrix.mode }}

  publish:
    name: Publish requested release
    needs: suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: solar-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          prune-cache: false
      - name: Publish only the validated release intent at this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOLAR_RELEASE_REPO: ${{ github.repository }}
        run: python3 core/scripts/release_automation.py publish
